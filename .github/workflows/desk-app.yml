name: Desk app

# Tests the desk app on real Windows and builds Kit-Desk-Setup.exe. The installer
# is attached to each run as an artifact (Actions tab > Desk app > the run >
# Artifacts). Builds of main are also published as a GitHub Release tagged
# desk-v<version>, which is where the desk app's update check looks.
# See docs/3 Deep Dives/Desk App Builds and Updates.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # to publish releases from main

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,desk]"
      # The whole suite, not a list of files: with the desk extra installed, the
      # PySide6 tests that ci.yml skips (the face, Glow, scenes, the 3D face) run here.
      # The rest takes under a minute.
      - name: All tests, desk app included (real Windows API, Qt without a screen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tests/
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build the installer
        id: build
        shell: pwsh
        env:
          # A pull request's build is a test build: it's only offered a release with its
          # commit in it (kit.desk.update).
          KIT_BUILD_PULL: ${{ github.event.pull_request.number }}
          KIT_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Kit-Desk-Setup
          path: packaging/windows/build/installer/*.exe
          if-no-files-found: error
      - name: Publish the release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          $notes = "Kit desk app $env:VERSION, built from $env:GITHUB_SHA.`n`n" +
                   "Install: download Kit-Desk-Setup-$env:VERSION.exe below and run it. " +
                   "Kit already installed? It offers this update by itself."
          $installer = (Get-ChildItem packaging/windows/build/installer/*.exe).FullName
          gh release create "desk-v$env:VERSION" $installer `
            --title "Kit desk app $env:VERSION" --notes $notes --target $env:GITHUB_SHA --latest
