[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kit"
version = "0.1.0"
description = "Kit, a personal AI assistant with a personality"
readme = "README.md"
requires-python = ">=3.11"
# Each version here is in the CI matrix (.github/workflows/ci.yml); a test checks they agree.
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
]
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "fastapi>=0.110",
    "pydantic>=2.7",
    "qrcode>=7.4",  # kit pair shows the pairing code as a QR code in the terminal
    "tomli-w>=1.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# The files libraries are in dev too, so the tests read real PDFs, Word files and sheets.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pypdf>=4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
]
# Reading Dan's documents into Kit's memory (docs/2 How Kit Works/Your Files.md).
files = ["pypdf>=4", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6.23"]
# Reading scanned PDFs as well: needs the tesseract and poppler programs installed.
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]
desk = ["PySide6>=6.6", "psutil>=5.9", "sounddevice>=0.4.6"]
# Kit's eyes, on the PC with the camera. opencv-contrib is the build MediaPipe wants;
# don't install plain opencv-python beside it. For GPU detection install PyTorch's
# CUDA build first (docs/4 Guides/Vision Stage 1.md).
eyes = ["opencv-contrib-python>=4.10", "ultralytics>=8.3", "lap>=0.5.12", "mediapipe>=1.0"]
# Lite eyes: the detector through OpenVINO on a CPU (docs/2 How Kit Works/Eyes.md).
eyes-cpu = ["openvino>=2024.0"]
# Kit's ears, on the PC with the mic: speech to text, voice detection and voice prints
# on the processor through sherpa-onnx (no PyTorch, no graphics card).
hearing = ["sherpa-onnx>=1.12", "sounddevice>=0.4.6"]

[project.scripts]
kit = "kit.cli:main"

[project.gui-scripts]
kit-desk = "kit.desk.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kit"]
# build.ps1 writes the build number here; it is gitignored, so it must be named to be packed.
artifacts = ["src/kit/desk/_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["assets", "pod"]  # Blender scripts, and the Pod's firmware and CAD tools

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
