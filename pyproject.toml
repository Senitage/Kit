[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kit"
version = "0.1.0"
description = "Kit, a personal AI assistant with a personality"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "fastapi>=0.110",
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
desk = ["PySide6>=6.6", "psutil>=5.9"]
# Kit's eyes, on the PC with the camera. opencv-contrib is the build MediaPipe wants;
# don't install plain opencv-python beside it. For GPU detection install PyTorch's
# CUDA build first (docs/stage-vision.md).
eyes = ["opencv-contrib-python>=4.10", "ultralytics>=8.3", "lap>=0.5.12", "mediapipe>=1.0"]

[project.scripts]
kit = "kit.cli:main"

[project.gui-scripts]
kit-desk = "kit.desk.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kit"]
# build.ps1 writes the build number here; it is gitignored, so it must be named to be packed.
artifacts = ["src/kit/desk/_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
