[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kit"
version = "0.1.0"
description = "Kit, a personal AI assistant with a personality"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "fastapi>=0.110",
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
desk = ["PySide6>=6.6", "psutil>=5.9", "sounddevice>=0.4.6"]

[project.scripts]
kit = "kit.cli:main"

[project.gui-scripts]
kit-desk = "kit.desk.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kit"]
# build.ps1 writes the build number here; it is gitignored, so it must be named to be packed.
artifacts = ["src/kit/desk/_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["assets"]  # Blender build scripts, run inside Blender

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
