# Kit's settings. Lives in Kit's data folder (run `kit paths` to see where).
# Secrets such as API keys never go in this file; see docs/stage-0-setup.md.

schema_version = 1

[ollama]
# Ollama on this machine, and the local model for everyday chat.
url = "http://127.0.0.1:11434"
model = "qwen3:8b"

# Thinking makes the local model slower to start talking; leave it off for chat.
think = false
temperature = 0.7
# Context window in tokens: must hold the persona, memories and recent history.
num_ctx = 8192
# Kit decides what to do in a quick JSON pass, then says his words in a second,
# plain-text pass at a livelier temperature. He sounds more like himself and
# repeats himself less; he starts talking about half a second later.
# false goes back to one JSON pass.
speak_pass = true
# How long the local model stays on the GPU after it was last used. With
# routing.background = "chat" in cloud-only mode it's 2m whatever this says.
keep_alive = "30m"
speak_temperature = 0.95     # his spoken words and his private thoughts
min_p = 0.05                 # keeps a high temperature sensible; 0 is off
repeat_penalty = 1.08        # discourages reusing the same words; 1 is off
repeat_last_n = 64           # how far back repeat_penalty looks, in tokens
top_k = 64                   # Gemma's suggested sampling: only the likeliest 64 words
top_p = 0.95                 # ...that make up 95% of the chance
# Read the conversation into the model ahead of your next message, once Kit and
# his voice have finished, so he starts answering sooner (about two seconds on
# Gemma, which otherwise re-reads the whole prompt every message). Not in
# cloud-only routing, where the local model only stands in.
warm_up = false

[routing]
# How much Kit leans on the local model:
#   local-heavy  the local model answers; the cloud only gets what it can't do
#   balanced     the local model takes small talk and quick commands, the cloud
#                takes real questions, work and anything current
#   cloud-first  the cloud answers everything
#   cloud-only   the chat model answers everything (even goodbyes, and chat while
#                another model is busy) and hands real work to the work model
# Say "keep it local", "ask Claude" or "think hard" to choose for one message.
mode = "balanced"
# Which model profile (see [models] below, or `kit models`) does what.
chat = "haiku"      # cloud-only: everyday messages
work = "sonnet"
expert = "opus"
# When the work model decides a question needs the expert, Kit asks you first.
# "Think hard" still goes straight to it.
confirm_expert = true
# If the cloud can't be reached, the local model answers instead.
fallback_to_local = true
# "Sydney's the capital, isn't it?": the work model checks it quickly and Kit
# says the answer himself, rather than the local model going by what it knows.
check_facts = true
# Who does Kit's own background work: his private thoughts, his pipe-ups and
# comparing something new you tell him with what he knows.
#   local  the local model
#   chat   the cloud: the chat model thinks and pipes up (about A$2 a month), the
#          work model compares facts; what you kept local stays home, and the
#          local model steps in if the cloud can't. In cloud-only mode the local
#          model then leaves the GPU 2 minutes after it's used, so the voice has it.
background = "local"
# The moments that matter get the work model's words in Kit's voice: his hello
# after a night or more away, and his answer when you share something sad or
# stressful. Never for "keep it local"; the local model steps in if need be.
key_moments = true
key_moment_strength = 0.7
key_moment_hellos = ["overnight", "days", "long"]

[cloud]
# Kit stops using cloud models once this month's spend reaches the cap.
monthly_cap_usd = 40.0
# As it runs low, calls give way in order, each this much sooner: evals, then
# fact checks and key moments, then chat. His nightly reflection gets the last.
reserve_usd = 3.0

# Built-in model profiles: sonnet, opus, haiku, gpt-sol and gemini-flash. Change any
# field here (prices change), or add your own and point a role at it.
# Each needs its provider's API key in the secrets folder; see docs/stage-0-setup.md.
# [models.sonnet]
# effort = "medium"
#
# [models.big-local]
# provider = "ollama"
# model = "qwen3.8:27b"

[brain]
# 127.0.0.1 keeps the chat page on this PC. Use "0.0.0.0" to let your phone in
# over the home network or Tailscale (the API token still protects it).
host = "127.0.0.1"
port = 8600
history_messages = 20

[memory]
# Kit finds memories by words and by meaning. The meaning part needs this
# embedding model in Ollama (`ollama pull nomic-embed-text`). Without it Kit
# still remembers, but only finds things by matching words.
embed_model = "nomic-embed-text"
relevant_memories = 8
relevant_things = 5          # register entries (people, vehicles, places...) per turn
conversation_snippets = 4
own_memories = 3             # from his own notebook: thoughts, opinions, moments, journal
weight_floor = 0.3           # what matters more and was recalled lately comes first; 1 is off
now_days = 14                # "how you've been lately" memories fade after this
day_pass = "work"            # who sorts each day's memories after midnight: work (Sonnet) or local

[nas]
# The Obsidian vault: the only NAS folder Kit may write to.
# Single quotes keep backslashes literal in TOML.
# vault = '\\NAS\home\Obsidian'
# Where in the vault Kit saves notes you ask it to take. Leave it out for the
# vault's top level.
# notes_folder = 'Inbox'

# Shares Kit may read but never change. Use UNC paths on Windows,
# mount points on Linux. The 'kit' NAS user should have read-only access.
[nas.read_only_shares]
# photos = '\\NAS\photo'
# documents = '\\NAS\home\Documents'

# Kit's character. Leave this out to use the built-in persona, or copy it from
# `kit config show` and change it. Changes apply from the next message.
# [persona]
# name = "Kit"
# owner = "Dan"
# location = "Richmond, NSW"   # city, state: web searches look near here
# country = "AU"
# timezone = "Australia/Sydney"
# traits = ["curious", "dry sense of humour", "loyal and practical"]
#
# [[persona.examples]]
# user = "Morning."
# kit = "Morning. Coffee first, or straight into it?"

# Kit's inner life: fidgets, boredom, piping up on his own, his own thoughts,
# and a nightly look back at his day (docs/life.md).
# [life]
# enabled = true
# cheek = 0.6            # 0 polite .. 1 larrikin
# chattiness = 0.5       # 0 never speaks first .. 1 whenever he feels like it
# max_per_hour = 3
# quiet_from = "22:00"
# quiet_until = "07:00"  # also when things he means to bring up "tomorrow" are due
# sleep_after_minutes = 10
#                           # after the desk has been empty this long; 0 never
# think_every_minutes = 8   # a private thought in a quiet moment while you're around
# thoughts_per_hour = 6     # each is a quick local model call; 0 stops them
# reflect_with = "cloud"    # who writes his journal and self-sheet each night:
#                           # cloud (a few cents), local, or off
# reflect_role = "expert"   # which cloud model: expert (Opus) or work (Sonnet)
# weekly_review = true      # the expert model reviews how he's changed, weekly
# homecoming = true         # glad when you're back after 20 min or more; says hello once
# miffed = true             # hours gone in the daytime with no goodbye: one mock huff
# miffed_after_days = 7     # ...but not in his first week
# games = true              # at most one small game a day, when he's bored
# threads = true            # "dentist Thursday arvo": he asks how it went, once
# chat_opener = true        # a new chat picks up one thing from the last one
# interview = true          # one getting-to-know-you question a day, till he knows
# nudges = true             # once a day each: toward bed, and outside after a long stretch
# bedtime = "22:30"
# desk_hours = 3.0          # at the desk this long without a break: the outside nudge
# work_triggers = false     # curious about work apps, sites and builds on screen
# alone_thoughts_per_hour = 0  # away life: he entertains himself while you're out and
#                           # thinks about it this often (local model only); 1 is plenty
# week_thoughts = false     # Monday, Friday and Saturday mornings, WA public holidays
# read_mood = "words"       # words, or meaning (after a passed `kit eval mood`)
# mixed_feelings = false    # two feelings at once
# bad_night = true          # a really bad time: no cheek, he stays, mentions Lifeline once
# energy_need = false       # chats, cloud jobs and late nights tire him; sleep restores
# opinions = 0              # standing opinions he keeps in mind when he talks (0 to 2)
# dials = false             # liveliness and happiness dials that the face shows
# pipe_up_bar = 0.0         # score a pipe-up first and keep quiet below this (0.5)

# [face]
# character = "retro"       # which character Kit is (src/kit/face/characters); retro is
#                           # the original glowing pill eyes, so switching back is easy
# hot_c = 35.0              # a dry day this hot (°C) shows as a hot day when you ask the weather
# pack_folder = ""          # a 3D face pack folder (face.json + .glb) to use instead of
#                           # the built-in one, e.g. your Blender project's pack folder

# Kit's eyes: the camera process (`kit eyes`, on the PC with the webcam) reads
# these from the brain, so there's one place to change them (docs/stage-vision.md).
# [eyes]
# enabled = true
# camera = 0               # `kit eyes cameras` lists them
# width = 1280
# height = 720
# mirror = true            # like a mirror, for a webcam facing you; false on the arm
# detector = "yolo11s"     # yolo11n is faster, yolo11m sharper; downloaded on first run
# confidence = 0.4
# forget_after_s = 3.0     # seconds out of view before someone has left
# report_every_s = 1.0
# faces = true             # where each person is looking, and their expression
# hands = true             # hand gestures
# poses = 1                # people to read body pose for; 0 turns it off
# recognise = true         # tell people apart once introduced (`kit eyes enrol NAME`)
# match = 0.4              # how alike a face must be to count; higher is stricter
