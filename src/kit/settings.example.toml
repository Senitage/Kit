# Kit's settings. Lives in Kit's data folder (run `kit paths` to see where).
# Secrets such as API keys never go in this file; see docs/stage-0-setup.md.

schema_version = 1

[ollama]
# Ollama on this machine, and the local model for everyday chat.
url = "http://127.0.0.1:11434"
model = "qwen3:8b"

# Thinking makes the local model slower to start talking; leave it off for chat.
think = false
temperature = 0.7
# Context window in tokens: must hold the persona, memories and recent history.
num_ctx = 8192
# Kit decides what to do in a quick JSON pass, then says his words in a second,
# plain-text pass at a livelier temperature. He sounds more like himself and
# repeats himself less; he starts talking about half a second later.
# false goes back to one JSON pass.
speak_pass = true
speak_temperature = 0.95     # his spoken words and his private thoughts
min_p = 0.05                 # keeps a high temperature sensible; 0 is off
repeat_penalty = 1.08        # discourages reusing the same words; 1 is off
repeat_last_n = 64           # how far back repeat_penalty looks, in tokens
top_k = 64                   # Gemma's suggested sampling: only the likeliest 64 words
top_p = 0.95                 # ...that make up 95% of the chance

[routing]
# How much Kit leans on the local model:
#   local-heavy  the local model answers; the cloud only gets what it can't do
#   balanced     the local model takes small talk and quick commands, the cloud
#                takes real questions, work and anything current
#   cloud-first  the cloud answers everything
# Say "keep it local", "ask Claude" or "think hard" to choose for one message.
mode = "balanced"
# Which model profile (see [models] below, or `kit models`) does what.
work = "sonnet"
expert = "opus"
# If the cloud can't be reached, the local model answers instead.
fallback_to_local = true
# "Perth's the capital, isn't it?": the work model checks it quickly and Kit
# says the answer himself, rather than the local model going by what it knows.
check_facts = true

[cloud]
# Kit stops using cloud models once this month's spend reaches the cap.
monthly_cap_usd = 40.0

# Built-in model profiles: sonnet, opus, gpt-sol and gemini-flash. Change any
# field here (prices change), or add your own and point a role at it.
# Each needs its provider's API key in the secrets folder; see docs/stage-0-setup.md.
# [models.sonnet]
# effort = "medium"
#
# [models.big-local]
# provider = "ollama"
# model = "qwen3.8:27b"

[brain]
# 127.0.0.1 keeps the chat page on this PC. Use "0.0.0.0" to let your phone in
# over the home network or Tailscale (the API token still protects it).
host = "127.0.0.1"
port = 8600
history_messages = 20

[memory]
# Kit finds memories by words and by meaning. The meaning part needs this
# embedding model in Ollama (`ollama pull nomic-embed-text`). Without it Kit
# still remembers, but only finds things by matching words.
embed_model = "nomic-embed-text"
relevant_memories = 8
relevant_things = 5          # register entries (people, vehicles, places...) per turn
conversation_snippets = 4
own_memories = 3             # from his own notebook: thoughts, opinions, moments, journal

[nas]
# The Obsidian vault: the only NAS folder Kit may write to.
# Single quotes keep backslashes literal in TOML.
# vault = '\\NAS\home\Obsidian'
# Where in the vault Kit saves notes you ask it to take. Leave it out for the
# vault's top level.
# notes_folder = 'Inbox'

# Shares Kit may read but never change. Use UNC paths on Windows,
# mount points on Linux. The 'kit' NAS user should have read-only access.
[nas.read_only_shares]
# photos = '\\NAS\photo'
# documents = '\\NAS\home\Documents'

# Kit's character. Leave this out to use the built-in persona, or copy it from
# `kit config show` and change it. Changes apply from the next message.
# [persona]
# name = "Kit"
# owner = "Dan"
# location = "Perth, WA"       # city, state: web searches look near here
# country = "AU"
# timezone = "Australia/Perth"
# traits = ["curious", "dry sense of humour", "loyal and practical"]
#
# [[persona.examples]]
# user = "Morning."
# kit = "Morning. Coffee first, or straight into it?"

# Kit's inner life: fidgets, boredom, piping up on his own, his own thoughts,
# and a nightly look back at his day (docs/life.md).
# [life]
# enabled = true
# cheek = 0.6            # 0 polite .. 1 larrikin
# chattiness = 0.5       # 0 never speaks first .. 1 whenever he feels like it
# max_per_hour = 3
# quiet_from = "22:00"
# quiet_until = "07:00"  # also when things he means to bring up "tomorrow" are due
# sleep_after_minutes = 10
# think_every_minutes = 8   # a private thought in a quiet moment while you're around
# thoughts_per_hour = 6     # each is a quick local model call; 0 stops them
# reflect_with = "cloud"    # who writes his journal and self-sheet each night:
#                           # cloud (the work model, a few cents), local, or off
# weekly_review = true      # the expert model reviews how he's changed, weekly
# homecoming = true         # glad when you're back after 20 min or more; says hello once
# miffed = true             # hours gone in the daytime with no goodbye: one mock huff
# miffed_after_days = 7     # ...but not in his first week
# games = true              # at most one small game a day, when he's bored
