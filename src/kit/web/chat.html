<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit</title>
<style>
  :root { --bg: #f6f5f2; --panel: #fff; --text: #1d1d1b; --muted: #6b6a66; --line: #e2e0da;
          --me: #1f5fbf; --me-text: #fff; --claude: #fbf2e4; --error: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #222220; --text: #ecebe7; --muted: #9c9a94; --line: #34332f;
            --me: #3b78d8; --me-text: #fff; --claude: #2e2717; --error: #f2b8b5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header a, header span { color: var(--muted); font-size: 14px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: min(680px, 88%); padding: 9px 13px; border-radius: 14px; white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--me); color: var(--me-text); }
  .kit { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .kit.claude { background: var(--claude); }
  .detail { display: block; margin-top: .5em; white-space: pre-wrap; font: .9em ui-monospace, monospace; }
  .meta { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .msg .choice { padding: 2px 10px; margin: 6px 6px 0 0; font-size: 13px; border-radius: 8px; }
  .error { align-self: center; color: var(--error); font-size: 14px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line);
         background: var(--panel); }
  textarea { flex: 1; resize: none; font: inherit; padding: 9px 12px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  button { font: inherit; padding: 0 16px; border-radius: 10px; border: 0; background: var(--me);
           color: var(--me-text); cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<header><h1 id="name">Kit</h1><span id="state">idle</span><a href="/memory">Memory</a><a href="/settings">Settings</a></header>
<div id="log"></div>
<form id="form">
  <textarea id="text" rows="1" placeholder="Talk to Kit. Say &quot;ask Claude&quot; for hard ones." autofocus></textarea>
  <button id="send">Send</button>
</form>
<script>
function token() {
  const m = location.hash.match(/token=([^&]+)/);
  if (m) { try { localStorage.setItem("kitToken", m[1]); } catch (e) {} history.replaceState(null, "", location.pathname); return m[1]; }
  let t = null;
  try { t = localStorage.getItem("kitToken"); } catch (e) {}
  if (!t) { t = prompt("Kit's API token (run `kit token` on the server):") || ""; try { localStorage.setItem("kitToken", t); } catch (e) {} }
  return t;
}
const TOKEN = token();
const headers = { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" };
const log = document.getElementById("log");
const stateEl = document.getElementById("state");

function bubble(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}
const isCloud = (source) => source === "cloud" || source === "claude";
function detail(div, reply) {
  if (!reply || !reply.detail) return;
  const pre = document.createElement("span");
  pre.className = "detail";
  pre.textContent = reply.detail;
  div.appendChild(pre);
}
function meta(div, reply, extra) {
  const span = document.createElement("span");
  span.className = "meta";
  const gestures = reply.segments.map(s => s.gesture).filter(g => g !== "none");
  span.textContent = [reply.emotion, ...gestures, ...(extra || [])].join(" · ");
  div.appendChild(span);
}
async function loadHistory() {
  const r = await fetch("/api/messages?limit=40", { headers });
  if (r.status === 401) { try { localStorage.removeItem("kitToken"); } catch (e) {} bubble("error", "Wrong token. Reload to enter it again."); return; }
  for (const m of await r.json()) {
    if (m.role === "user") bubble("user", m.text);
    else {
      const d = bubble("kit" + (isCloud(m.source) ? " claude" : ""), m.reply ? m.reply.segments.map(x => x.say).join(" ") : m.text);
      if (m.reply) { detail(d, m.reply); meta(d, m.reply, isCloud(m.source) ? ["cloud"] : []); }
    }
  }
  const s = await fetch("/api/health").then(r => r.json());
  document.getElementById("name").textContent = s.name;
  document.title = s.name;
}
function suggestThing(thing) {
  const div = bubble("error", "Add to the register? " + thing.line + " ");
  div.style.color = "var(--muted)";
  const choose = (label, action, done) => {
    const b = document.createElement("button");
    b.className = "choice"; b.textContent = label;
    b.addEventListener("click", async () => {
      const r = await fetch(`/api/things/${thing.id}/${action}`, { method: "POST", headers });
      div.textContent = r.ok ? done : "Already answered, or gone. See the memory page.";
    });
    div.appendChild(b);
  };
  div.appendChild(document.createElement("br"));
  choose("Add", "confirm", "Added " + thing.name + " to the register.");
  choose("No", "reject", "Left " + thing.name + " out.");
}
let inFlight = 0;
function idle() { if (--inFlight === 0) stateEl.textContent = "idle"; }
async function send(text) {
  const asked = bubble("user", text);
  inFlight++;
  stateEl.textContent = "thinking";
  let current = null;
  const r = await fetch("/api/chat", { method: "POST", headers, body: JSON.stringify({ text }) });
  if (!r.ok) { bubble("error", "Kit said " + r.status); idle(); return; }
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 1);
      if (!line.trim()) continue;
      const ev = JSON.parse(line);
      if (ev.type === "say") {
        if (!current) { current = bubble("kit" + (isCloud(ev.source) ? " claude" : ""), ""); stateEl.textContent = "speaking"; }
        current.firstChild ? current.firstChild.nodeValue += ev.text : current.textContent = ev.text;
        log.scrollTop = log.scrollHeight;
      } else if (ev.type === "reply") {
        if (!current) current = bubble("kit", "");
        current.textContent = ev.reply.segments.map(s => s.say).join(" ");
        const extra = isCloud(ev.source) ? [ev.label + " (" + ev.model + ")", "$" + ev.cost_usd.toFixed(3), "month $" + ev.month_usd.toFixed(2)] : [];
        if (ev.searches) extra.push(ev.searches + " search" + (ev.searches > 1 ? "es" : ""));
        // A slow answer that arrives after other messages says what it answers.
        if (ev.question && asked !== lastUserBubble()) extra.unshift("re: " + ev.question);
        detail(current, ev.reply);
        meta(current, ev.reply, extra);
        current = null;
      } else if (ev.type === "handing_off") {
        stateEl.textContent = "asking " + ev.to;
        current = null;
      } else if (ev.type === "notice") {
        bubble("error", ev.message).style.color = "var(--muted)";
        current = null;
      } else if (ev.type === "remembered") {
        const label = ev.decision === "same" ? "Already knew: " : ev.decision === "update" ? "Updated memory: " : "Remembered: ";
        bubble("error", label + ev.fact).style.color = "var(--muted)";
      } else if (ev.type === "thing_suggested") {
        suggestThing(ev.thing);
      } else if (ev.type === "thing_updated" && ev.thing) {
        bubble("error", "Updated the register: " + ev.thing.line).style.color = "var(--muted)";
      } else if (ev.type === "recalled") {
        stateEl.textContent = "remembering";
        current = null;
      } else if (ev.type === "looked_at_pc") {
        stateEl.textContent = "looking at your PC";
        current = null;
      } else if (ev.type === "error") {
        bubble("error", ev.message);
      }
    }
  }
  idle();
}
function lastUserBubble() { const all = log.querySelectorAll(".msg.user"); return all[all.length - 1]; }
const form = document.getElementById("form");
const input = document.getElementById("text");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; input.focus();
  // No waiting for the answer: Kit can chat while a slow question is still working.
  send(text).catch(err => { bubble("error", "Lost touch with Kit: " + err.message); stateEl.textContent = "offline"; });
});
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
loadHistory().catch(err => { bubble("error", "Kit is offline: " + err.message); stateEl.textContent = "offline"; });
</script>
</body>
</html>
