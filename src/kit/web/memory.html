<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit memory</title>
<style>
  :root { --bg: #f6f5f2; --panel: #fff; --text: #1d1d1b; --muted: #6b6a66; --line: #e2e0da;
          --accent: #1f5fbf; --error: #b3261e; --pin: #a5640b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #222220; --text: #ecebe7; --muted: #9c9a94; --line: #34332f;
            --accent: #3b78d8; --error: #f2b8b5; --pin: #e8b04a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; }
  header h1 { flex: 1; font-size: 22px; margin: 8px 0 12px; }
  a { color: var(--accent); }
  .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input, select { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
                  background: var(--panel); color: var(--text); }
  input[type=text] { flex: 1; min-width: 200px; }
  button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border: 0; }
  .note { color: var(--muted); font-size: 13px; min-height: 1.4em; white-space: pre-wrap; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 9px 12px; margin-bottom: 6px; }
  .item .text { overflow-wrap: anywhere; }
  .item .meta { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 12px;
                margin-top: 4px; flex-wrap: wrap; }
  .item .meta button { padding: 2px 8px; font-size: 12px; }
  .pinned { border-color: var(--pin); }
  .pinned .pin { color: var(--pin); font-weight: 600; }
  .old { opacity: .6; text-decoration: line-through; }
</style>
</head>
<body>
<main>
  <header><h1>What Kit remembers</h1><a href="/">Chat</a><a href="/settings">Settings</a></header>
  <div class="row">
    <input type="text" id="q" placeholder="Search memory the way Kit does">
    <button id="search">Search</button>
  </div>
  <div id="results"></div>
  <div class="row">
    <input type="text" id="fact" placeholder="Teach Kit something, e.g. My tax returns are in Documents/Finance/Tax">
    <select id="kind"></select>
    <button class="primary" id="add">Remember</button>
  </div>
  <div class="note" id="note"></div>
  <h2>Things and where they live</h2>
  <div id="suggestions"></div>
  <div class="row">
    <input type="text" id="thing" placeholder="Name, e.g. Hilux">
    <select id="thingKind"></select>
    <select id="system"></select>
    <input type="text" id="target" placeholder="Where, e.g. Documents/Cars/Hilux">
    <button class="primary" id="addThing">Add</button>
  </div>
  <div id="things"></div>
  <div id="facts"></div>
  <h2>Days</h2>
  <div id="days"></div>
</main>
<script>
function token() {
  const m = location.hash.match(/token=([^&]+)/);
  if (m) { try { localStorage.setItem("kitToken", m[1]); } catch (e) {} history.replaceState(null, "", location.pathname); return m[1]; }
  let t = null;
  try { t = localStorage.getItem("kitToken"); } catch (e) {}
  if (!t) { t = prompt("Kit's API token (run `kit token` on the server):") || ""; try { localStorage.setItem("kitToken", t); } catch (e) {} }
  return t;
}
const headers = { "Authorization": "Bearer " + token(), "Content-Type": "application/json" };
const KINDS = ["about", "preference", "project", "place", "person", "plan", "other"];
const THING_KINDS = ["person", "pet", "vehicle", "place", "project", "equipment", "other"];
const SYSTEMS = { home_assistant: "Home Assistant", home_app: "home_app", nas: "NAS", mettools: "MetTools", obsidian: "Obsidian", code: "code", other: "other" };
const note = document.getElementById("note");
async function api(path, opts) {
  const r = await fetch(path, { headers, ...opts });
  const body = await r.json();
  if (r.status === 401) { try { localStorage.removeItem("kitToken"); } catch (e) {} throw new Error("wrong token; reload and enter it again"); }
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail));
  return body;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function button(label, fn) { const b = el("button", "", label); b.addEventListener("click", fn); return b; }

function factCard(f) {
  const card = el("div", "item" + (f.pinned ? " pinned" : ""));
  card.appendChild(el("div", "text", f.text));
  const meta = el("div", "meta");
  meta.append(el("span", "", f.day + (f.updated.slice(0, 10) !== f.day ? ", changed " + f.updated.slice(0, 10) : "")));
  if (f.pinned) meta.append(el("span", "pin", "always in mind"));
  meta.append(
    button(f.pinned ? "Unpin" : "Pin", async () => { await api(`/api/memory/facts/${f.id}`, { method: "PATCH", body: JSON.stringify({ pinned: !f.pinned }) }); load(); }),
    button("Edit", async () => {
      const text = prompt("Change this fact (the old version is kept in its history):", f.text);
      if (text && text.trim() !== f.text) { await api(`/api/memory/facts/${f.id}`, { method: "PATCH", body: JSON.stringify({ text }) }); load(); }
    }),
    button("History", async () => {
      const versions = await api(`/api/memory/facts/${f.id}/history`);
      const box = el("div", "");
      for (const v of versions.slice(1)) box.appendChild(el("div", "old", v.day + ": " + v.text));
      if (versions.length < 2) box.appendChild(el("div", "note", "No earlier versions."));
      card.appendChild(box);
    }),
    button("Forget", async () => { if (confirm("Forget this for good?")) { await api(`/api/memory/facts/${f.id}`, { method: "DELETE" }); load(); } }),
  );
  card.appendChild(meta);
  return card;
}
function linksText(t) {
  return t.links.length ? t.links.map(l => (SYSTEMS[l.system] || l.system) + ": " + l.target).join(" · ") : "nowhere recorded yet";
}
function thingCard(t) {
  const card = el("div", "item");
  const also = t.aliases.length ? " (also " + t.aliases.join(", ") + ")" : "";
  card.appendChild(el("div", "text", t.name + also + (t.about ? ". " + t.about : "")));
  card.appendChild(el("div", "meta", linksText(t)));
  const meta = el("div", "meta");
  meta.append(el("span", "", t.kind));
  if (t.suggested) {
    meta.append(
      button("Add", async () => { await api(`/api/things/${t.id}/confirm`, { method: "POST" }); load(); }),
      button("No", async () => { await api(`/api/things/${t.id}/reject`, { method: "POST" }); load(); }),
    );
  } else {
    meta.append(
      button("Set link", async () => {
        const system = prompt("Which system? " + Object.keys(SYSTEMS).join(", "), "nas");
        if (!system || !(system in SYSTEMS)) return;
        const current = t.links.find(l => l.system === system);
        const target = prompt("Where in " + SYSTEMS[system] + "? (leave empty to remove)", current ? current.target : "");
        if (target === null) return;
        const links = t.links.filter(l => l.system !== system).concat(target.trim() ? [{ system, target: target.trim() }] : []);
        await api(`/api/things/${t.id}`, { method: "PATCH", body: JSON.stringify({ links }) }); load();
      }),
      button("Other names", async () => {
        const text = prompt("Other names, separated by commas:", t.aliases.join(", "));
        if (text === null) return;
        const aliases = text.split(",").map(a => a.trim()).filter(Boolean);
        await api(`/api/things/${t.id}`, { method: "PATCH", body: JSON.stringify({ aliases }) }); load();
      }),
      button("History", async () => {
        const versions = await api(`/api/things/${t.id}/history`);
        const box = el("div", "");
        for (const v of versions.slice(1)) box.appendChild(el("div", "old", linksText(v)));
        if (versions.length < 2) box.appendChild(el("div", "note", "No earlier versions."));
        card.appendChild(box);
      }),
      button("Forget", async () => { if (confirm("Take " + t.name + " out of the register?")) { await api(`/api/things/${t.id}`, { method: "DELETE" }); load(); } }),
    );
  }
  card.appendChild(meta);
  return card;
}
async function loadThings() {
  const [things, suggested] = await Promise.all([api("/api/things"), api("/api/things/suggestions")]);
  const sbox = document.getElementById("suggestions");
  sbox.innerHTML = "";
  if (suggested.length) sbox.appendChild(el("p", "note", "Kit heard these names and suggests adding them:"));
  for (const t of suggested) sbox.appendChild(thingCard(t));
  const box = document.getElementById("things");
  box.innerHTML = "";
  if (!things.length) box.appendChild(el("p", "note", "Nothing in the register yet. Add people, vehicles, rooms, projects and equipment with where each one lives."));
  for (const t of things) box.appendChild(thingCard(t));
}
async function load() {
  await loadThings();
  const facts = await api("/api/memory/facts");
  const box = document.getElementById("facts");
  box.innerHTML = "";
  if (!facts.length) box.appendChild(el("p", "note", "Nothing remembered yet. Tell Kit something, or add it above."));
  for (const kind of KINDS) {
    const group = facts.filter(f => f.kind === kind).sort((a, b) => b.pinned - a.pinned);
    if (!group.length) continue;
    box.appendChild(el("h2", "", ({ about: "About you", place: "Where things are", person: "People", preference: "Preferences", project: "Projects", plan: "Plans", other: "Other" })[kind] || kind));
    for (const f of group) box.appendChild(factCard(f));
  }
  const days = document.getElementById("days");
  days.innerHTML = "";
  const list = await api("/api/memory/days");
  if (!list.length) days.appendChild(el("p", "note", "Each finished day gets a summary here."));
  for (const d of list) { const c = el("div", "item"); c.append(el("div", "text", d.text), el("div", "meta", d.title)); days.appendChild(c); }
}
document.getElementById("thingKind").append(...THING_KINDS.map(k => { const o = el("option", "", k); o.value = k; return o; }));
document.getElementById("system").append(...Object.entries(SYSTEMS).map(([k, v]) => { const o = el("option", "", v); o.value = k; return o; }));
document.getElementById("addThing").addEventListener("click", async () => {
  const name = document.getElementById("thing").value.trim();
  const target = document.getElementById("target").value.trim();
  if (!name) return;
  const links = target ? [{ system: document.getElementById("system").value, target }] : [];
  try {
    await api("/api/things", { method: "POST", body: JSON.stringify({ name, kind: document.getElementById("thingKind").value, links }) });
    document.getElementById("thing").value = ""; document.getElementById("target").value = "";
    note.textContent = "Added " + name + "."; load();
  } catch (e) { note.textContent = "Not saved: " + e.message; }
});
document.getElementById("kind").append(...KINDS.map(k => { const o = el("option", "", k); o.value = k; return o; }));
document.getElementById("add").addEventListener("click", async () => {
  const input = document.getElementById("fact");
  const text = input.value.trim();
  if (!text) return;
  note.textContent = "Thinking about how this fits with what I know...";
  try {
    const r = await api("/api/memory/facts", { method: "POST", body: JSON.stringify({ text, kind: document.getElementById("kind").value }) });
    note.textContent = r.decision === "same" ? "Already knew that." : r.decision === "update" ? "Updated: " + r.replaced : "Remembered.";
    input.value = ""; load();
  } catch (e) { note.textContent = "Not saved: " + e.message; }
});
document.getElementById("search").addEventListener("click", search);
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
async function search() {
  const q = document.getElementById("q").value.trim();
  const box = document.getElementById("results");
  box.innerHTML = "";
  if (!q) return;
  const r = await api("/api/memory/search?q=" + encodeURIComponent(q));
  if (r.words_only) box.appendChild(el("p", "note", "Searching by words only: the embedding model isn't answering."));
  if (!r.hits.length) box.appendChild(el("p", "note", "Nothing found."));
  for (const h of r.hits) {
    const c = el("div", "item");
    const how = [h.word_match ? "words" : "", h.similarity != null ? "meaning " + h.similarity.toFixed(2) : ""].filter(Boolean).join(" + ");
    c.append(el("div", "text", h.text), el("div", "meta", `${h.day} · ${h.source} · ${how}`));
    box.appendChild(c);
  }
}
load().catch(e => { note.textContent = "Can't reach Kit: " + e.message; });
</script>
</body>
</html>
